<!doctype html>
<html lang="pl" data-bs-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Logowanie – Tixx</title>

  <!-- Tabler CSS & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Własne style -->
  <link rel="stylesheet" href="/src/assets/app.css">

  <!-- Motyw ustawiany przed renderem, żeby strona nie mignęła na biało w trybie ciemnym -->
  <script>
    try {
      document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('tixx-theme') || 'light');
    } catch (e) { /* ignore */ }
  </script>
</head>

<body class="d-flex flex-column">
  <div class="page page-center">
    <div class="container container-tight py-4">

      <!-- Logo -->
      <div class="text-center mb-4">
        <a href="/login" class="d-inline-flex align-items-center gap-2 text-decoration-none text-reset">
          <span class="bg-primary text-white avatar rounded">
            <i class="ti ti-ticket fs-2"></i>
          </span>
          <span class="text-start">
            <span class="fw-bold fs-2 lh-1 d-block">Tixx</span>
            <span class="text-secondary d-block" style="font-size:.7rem;letter-spacing:.06em;">SERVICE DESK</span>
          </span>
        </a>
      </div>

      <!-- Formularz logowania -->
      <div class="card card-md">
        <div class="card-body">
          <h2 class="h2 text-center mb-4">Zaloguj się do konta</h2>

          <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

          <form id="login-form" autocomplete="on" novalidate>
            <div class="mb-3">
              <label class="form-label" for="login-email">Adres e-mail</label>
              <input type="email" class="form-control" id="login-email" name="email"
                     placeholder="jan.kowalski@firma.pl" autocomplete="username" required autofocus>
            </div>

            <div class="mb-2">
              <label class="form-label" for="login-password">Hasło</label>
              <div class="input-group input-group-flat">
                <input type="password" class="form-control" id="login-password" name="password"
                       placeholder="Twoje hasło" autocomplete="current-password" required>
                <span class="input-group-text">
                  <a href="#" class="link-secondary" id="login-password-toggle"
                     title="Pokaż hasło" aria-label="Pokaż hasło" data-bs-toggle="tooltip">
                    <i class="ti ti-eye fs-3"></i>
                  </a>
                </span>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-check">
                <input type="checkbox" class="form-check-input" id="login-remember" name="remember">
                <span class="form-check-label">Zapamiętaj mnie na tym urządzeniu</span>
              </label>
            </div>

            <div class="form-footer">
              <button type="submit" id="login-submit" class="btn btn-primary w-100">
                <i class="ti ti-login-2 me-1"></i>
                <span>Zaloguj się</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center text-secondary mt-3">
        Nie pamiętasz hasła lub nie masz konta? Skontaktuj się z działem IT.
      </div>
    </div>
  </div>

  <script src="/src/utils/utils.js"></script>
  <script src="/src/services/api.js"></script>
  <script src="/src/components/login.js"></script>
</body>
</html>

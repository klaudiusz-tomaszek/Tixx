services:
  postgres:
    image: postgres:18.6
    container_name: it_tickets_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_service_desk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    #volumes:
    #  - postgres_data:/var/lib/postgresql/data
    #  - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-it_service_desk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticket_net

  adminer:
    image: adminer:latest
    container_name: it_tickets_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticket_net

#volumes:
#  postgres_data:
#    name: it_tickets_postgres_data

networks:
  ticket_net:
    name: it_tickets_network

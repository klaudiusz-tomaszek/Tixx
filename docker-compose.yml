services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_service_desk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Europe/Warsaw}
      PGTZ: ${TZ:-Europe/Warsaw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-it_service_desk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticket_net

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      TZ: ${TZ:-Europe/Warsaw}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticket_net

  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web:/app
    environment:
      PORT: 3000
      NODE_ENV: development
      TZ: ${TZ:-Europe/Warsaw}
    command: sh -c "npm install && node server.js"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticket_net

networks:
  ticket_net:
    name: it_tickets_network

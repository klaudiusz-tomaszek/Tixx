name: tixx

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tixx}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Europe/Warsaw}
      PGTZ: ${TZ:-Europe/Warsaw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./innit/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tixx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tixx_network

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      TZ: ${TZ:-Europe/Warsaw}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tixx_network

  webserver:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server:/app
      - ./client:/client
      - ./innit/web/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      PORT: 3000
      NODE_ENV: development
      CLIENT_DIR: /client
      TZ: ${TZ:-Europe/Warsaw}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-tixx}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_TRIAGE_MODEL: ${AI_TRIAGE_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "${WEB_PORT:-3300}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tixx_network

networks:
  tixx_network:
